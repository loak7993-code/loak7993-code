<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="glowTR" cx="88%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBL" cx="6%" cy="96%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="#050505"/>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M120 0 V340 M300 0 V340 M480 0 V340 M660 0 V340 M840 0 V340 M1020 0 V340"/>
  </g>

  <rect width="1200" height="340" fill="url(#glowTR)"/>
  <rect width="1200" height="340" fill="url(#glowBL)"/>

  <!-- top mono label -->
  <text x="80" y="72" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="15" fill="#9198A1" letter-spacing="2">~/loak7993-code</text>

  <!-- wordmark -->
  <text x="76" y="172" font-size="82" font-weight="800" fill="#E6EDF3" letter-spacing="-2">Destinedt</text>
  <rect x="80" y="196" width="320" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- tagline -->
  <text x="80" y="240" font-size="24" fill="#9198A1">vibe coder who doesn't create slop · AI agents, Rust runtimes, Android tools</text>

  <!-- terminal chip -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace">
    <rect x="836" y="82" width="290" height="96" rx="12" fill="#101014" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="860" cy="106" r="5" fill="#3B82F6" fill-opacity="0.9"/>
    <circle cx="880" cy="106" r="5" fill="#3B82F6" fill-opacity="0.45"/>
    <circle cx="900" cy="106" r="5" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="860" y="142" font-size="15" fill="#9198A1">$ velox --version</text>
    <text x="860" y="164" font-size="15" fill="#E6EDF3">2.6.1 <tspan fill="#3B82F6">zero deps</tspan></text>
  </g>

  <!-- language strip -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, monospace" font-size="14" letter-spacing="1">
    <text x="80" y="292" fill="#E6EDF3" fill-opacity="0.55">TypeScript</text>
    <circle cx="192" cy="288" r="2.5" fill="#3B82F6"/>
    <text x="206" y="292" fill="#E6EDF3" fill-opacity="0.55">Rust</text>
    <circle cx="266" cy="288" r="2.5" fill="#3B82F6"/>
    <text x="280" y="292" fill="#E6EDF3" fill-opacity="0.55">Kotlin</text>
    <circle cx="348" cy="288" r="2.5" fill="#3B82F6"/>
    <text x="362" y="292" fill="#E6EDF3" fill-opacity="0.55">C</text>
    <circle cx="396" cy="288" r="2.5" fill="#3B82F6"/>
    <text x="410" y="292" fill="#E6EDF3" fill-opacity="0.55">Python</text>
    <circle cx="490" cy="288" r="2.5" fill="#3B82F6"/>
    <text x="504" y="292" fill="#E6EDF3" fill-opacity="0.55">Gradle</text>
